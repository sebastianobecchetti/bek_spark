<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Splats</title>

    <!-- Import Maps for Three.js and Spark CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js",
            "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/",
            "@sparkjs/core": "https://sparkjs.dev/releases/spark/0.1.10/spark.module.js"
        }
    }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            height: 100vh;
            width: 100vw;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }

        #container-a,
        #container-b {
            flex: 1;
            position: relative;
            height: 100%;
        }

        /* Divider line between views */
        #container-a::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            width: 2px;
            height: 100%;
            background-color: #333;
            z-index: 5;
        }

        .label {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            z-index: 10;
            user-select: none;
            backdrop-filter: blur(4px);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #controls-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        #screenshot-btn,
        #psnr-btn {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 6px 12px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            pointer-events: all;
        }

        #psnr-btn:hover {
            background-color: #45a049;
        }

        #screenshot-btn {
            background-color: #2196F3;
        }

        #screenshot-btn:hover {
            background-color: #0b7dda;
        }
    </style>
</head>

<body>
    <div id="container-a">
        <div class="label">Ground Truth (A)</div>
    </div>
    <div id="container-b">
        <div class="label">Processed (B)</div>
    </div>
    <div id="controls-overlay">
        <span>Left Mouse: Rotate | Right Mouse: Pan | Scroll: Zoom</span>
        <button id="psnr-btn">Calculate PSNR</button>
        <button id="screenshot-btn">Download PNGs</button>
    </div>

    <script type="module" src="./main.js"></script>
</body>

</html>
